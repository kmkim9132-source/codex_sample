<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">뷰티 비즈니스 UX 스튜디오 랜딩페이지 디자인 시안</title>
<desc id="desc">디자이너 협찬 성장 패키지 랜딩페이지의 1920px 데스크톱 히어로와 하단 섹션 시안</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f5"/><stop offset="0.55" stop-color="#f7eee8"/><stop offset="1" stop-color="#efe5dc"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#f3ded4" stop-opacity=".84"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#4a2a20" flood-opacity=".16"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="44"/></filter>
  <style>
    .sans{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Inter',Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.dark{fill:#2a1b18}.muted{fill:#7b6660}.line{stroke:#d9c4ba;stroke-width:1.4}.pill{fill:#fffaf7;stroke:#e6d4cc;stroke-width:1.2}.small{font-size:18px;letter-spacing:.02em}.nav{font-size:17px}.h1{font-size:92px;font-weight:700;letter-spacing:-.055em}.h2{font-size:42px;font-weight:700;letter-spacing:-.035em}.body{font-size:25px;line-height:1.5}.label{font-size:15px;letter-spacing:.16em;font-weight:700}.btn{font-size:20px;font-weight:700}.chip{font-size:17px;font-weight:700}.kpi{font-size:54px;font-weight:700;letter-spacing:-.04em}.caption{font-size:16px}.num{font-size:32px;font-weight:700}
  </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<circle cx="1530" cy="146" r="230" fill="#f2cfc4" opacity=".42" filter="url(#soft)"/><circle cx="236" cy="866" r="260" fill="#dec6b9" opacity=".35" filter="url(#soft)"/>
<!-- content max-width 1440, margin 240 -->
<rect x="240" y="38" width="1440" height="86" rx="43" fill="#fffaf7" opacity=".78" stroke="#e7d6cf"/>
<text x="282" y="91" class="sans dark" font-size="24" font-weight="800" letter-spacing="-.03em">Beauty UX Studio</text>
<text x="745" y="90" class="sans muted nav">프로그램</text><text x="865" y="90" class="sans muted nav">포트폴리오</text><text x="1012" y="90" class="sans muted nav">브랜드 협업</text><text x="1183" y="90" class="sans muted nav">후기</text>
<rect x="1464" y="56" width="178" height="50" rx="25" fill="#2a1b18"/><text x="1502" y="88" class="sans" fill="#fff8f5" font-size="17" font-weight="700">상담 예약</text>
<g transform="translate(240 178)">
  <rect x="0" y="0" width="1440" height="620" rx="48" fill="#fffaf7" opacity=".52" stroke="#e9d9d1"/>
  <g transform="translate(70 78)">
    <rect width="272" height="38" rx="19" class="pill"/><text x="22" y="25" class="sans label" fill="#8d5e52">SPONSORSHIP GROWTH</text>
    <text x="0" y="128" class="sans dark h1">디자이너 협찬</text>
    <text x="0" y="230" class="sans dark h1">성장 패키지</text>
    <text x="3" y="294" class="sans muted body">실력은 있지만 브랜드에 발견되지 않는 뷰티 디자이너를 위해</text>
    <text x="3" y="334" class="sans muted body">계정·포트폴리오·제안서를 정리하고 브랜드 협업을 연결합니다.</text>
    <g transform="translate(0 386)"><rect width="188" height="56" rx="28" fill="#2a1b18"/><text x="34" y="36" class="sans btn" fill="#fff8f5">패키지 보기</text><rect x="206" width="210" height="56" rx="28" fill="none" stroke="#cdb7ae"/><text x="239" y="36" class="sans btn dark">협찬 진단 받기</text></g>
    <g transform="translate(0 484)"><text class="sans kpi dark">3</text><text x="42" y="-1" class="sans caption muted">단계 정리</text><text x="42" y="24" class="sans caption muted">계정 · 포트폴리오 · 제안서</text><line x1="234" x2="234" y1="-26" y2="34" class="line"/><text x="272" class="sans kpi dark">1:1</text><text x="358" y="-1" class="sans caption muted">브랜드 핏</text><text x="358" y="24" class="sans caption muted">협업 제안 설계</text></g>
  </g>
  <g transform="translate(865 70)">
    <rect x="0" y="30" width="430" height="520" rx="42" fill="url(#card)" filter="url(#shadow)"/>
    <rect x="42" y="78" width="346" height="214" rx="30" fill="#e6cabe"/><circle cx="146" cy="178" r="66" fill="#c99d92" opacity=".72"/><rect x="226" y="116" width="86" height="150" rx="43" fill="#fff7f1" stroke="#b88479"/><rect x="249" y="90" width="40" height="38" rx="14" fill="#2a1b18" opacity=".82"/>
    <text x="42" y="350" class="sans h2 dark">Collab-ready Profile</text><text x="42" y="392" class="sans small muted">SNS 운영은 목적이 아니라 협찬을 받을 수 있는</text><text x="42" y="422" class="sans small muted">상태를 만드는 수단입니다.</text>
    <g transform="translate(42 464)"><rect width="104" height="38" rx="19" fill="#2a1b18" opacity=".92"/><text x="23" y="25" class="sans chip" fill="#fff8f5">계정</text><rect x="118" width="128" height="38" rx="19" class="pill"/><text x="142" y="25" class="sans chip dark">제안서</text><rect x="260" width="114" height="38" rx="19" class="pill"/><text x="283" y="25" class="sans chip dark">협업</text></g>
    <g transform="translate(-48 0)"><rect x="0" y="0" width="150" height="190" rx="32" fill="#fffaf7" stroke="#e2cec5" filter="url(#shadow)"/><text x="28" y="54" class="sans label" fill="#8d5e52">PORTFOLIO</text><line x1="28" y1="86" x2="122" y2="86" class="line"/><line x1="28" y1="112" x2="104" y2="112" class="line"/><line x1="28" y1="138" x2="118" y2="138" class="line"/></g>
  </g>
</g>
<g transform="translate(240 850)">
  <text x="0" y="0" class="sans label" fill="#8d5e52">PROGRAM FLOW</text><text x="0" y="62" class="sans h2 dark">브랜드가 이해하기 쉬운 협업 구조로 재정리</text>
  <g transform="translate(0 110)"><rect width="430" height="122" rx="30" fill="#fffaf7" stroke="#e5d4cc"/><text x="30" y="52" class="sans num dark">01</text><text x="94" y="48" class="sans" font-size="25" font-weight="700" fill="#2a1b18">계정 포지셔닝</text><text x="94" y="82" class="sans small muted">전문성·톤·콘텐츠 기준 정리</text></g>
  <g transform="translate(505 110)"><rect width="430" height="122" rx="30" fill="#fffaf7" stroke="#e5d4cc"/><text x="30" y="52" class="sans num dark">02</text><text x="94" y="48" class="sans" font-size="25" font-weight="700" fill="#2a1b18">포트폴리오 패키징</text><text x="94" y="82" class="sans small muted">브랜드가 보는 성과 중심 구성</text></g>
  <g transform="translate(1010 110)"><rect width="430" height="122" rx="30" fill="#2a1b18"/><text x="30" y="52" class="sans num" fill="#fff8f5">03</text><text x="94" y="48" class="sans" font-size="25" font-weight="700" fill="#fff8f5">협업 제안 연결</text><text x="94" y="82" class="sans small" fill="#d9c4ba">브랜드 핏 제안서와 콜라보 매칭</text></g>
</g>
</svg>
